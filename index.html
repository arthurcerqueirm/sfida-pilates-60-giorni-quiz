    <div class="topline"><button class="back" id="back" aria-label="Torna indietro">‹</button><div class="brand"><img src="assets/optimized/logo-sfida-pilates-compact.webp" alt="Sfida Pilates 60 Giorni"></div><div class="stepnum" id="stepnum"></div></div>
    <div class="progress"><span id="progress"></span></div>
  </header>
  <main><section class="screen" id="screen" aria-live="polite"></section></main>
</div>
<div class="toast" id="toast">Il link di pagamento verrà collegato qui.</div>
<script>
const state={step:0,age:'',weight:72,height:163,body:'',pains:[],activity:'',phase:'',goal:'',target:null,barrier:''};
const screen=document.querySelector('#screen'), progress=document.querySelector('#progress'), stepnum=document.querySelector('#stepnum'), back=document.querySelector('#back');
const total=10;
const painLabels={knee:'Ginocchia',lower:'Zona lombare',trapezius:'Trapezio e parte alta della schiena',none:'Nessun fastidio'};
function bmi(){return state.weight/((state.height/100)**2)}
function branch(){const b=bmi();if(b>=25||(b>=23.5&&['soft','round'].includes(state.body)))return'loss';if(b<21.5||state.body==='slim')return'gain';return state.goal==='lose'?'loss':'tone'}
function setTop(){const intro=state.step===0, done=state.step>total; progress.style.width=intro?'0%':Math.min(100,state.step/total*100)+'%';stepnum.textContent=intro||done?'':state.step+'/'+total;back.style.visibility=state.step>0&&!done?'visible':'hidden'}
function render(){setTop();window.scrollTo({top:0,behavior:'smooth'});const s=state.step;
 if(s===0)return view(`<div class="brand-lockup"><img src="assets/logo-sfida-pilates-compact.png" alt="Sfida Pilates 60 Giorni"></div><span class="eyebrow">Valutazione gratuita</span><h1>Il tuo corpo è cambiato.<br>Il tuo metodo dovrebbe cambiare con te.</h1><p>Rispondi a poche domande e scopri un percorso di Pilates dolce pensato per il tuo momento, i tuoi fastidi e il tuo obiettivo.</p><div class="hero-card"><img src="assets/quiz-cover-giulia.png" alt="Giulia Moretti presenta il percorso di Pilates"><span class="hero-badge">✓ Richiede circa 2 minuti</span></div><button class="primary" onclick="next()">Inizia la valutazione</button><div class="micro">Risposte riservate • Nessun impegno</div>`);
 if(s===1)return choiceStep('Parliamo di te','Quanti anni hai?','L’età ci aiuta ad adattare intensità e obiettivi.',[['18-29','18-29 anni'],['30-40','30-40 anni'],['41-44','41-44 anni'],['45-49','45-49 anni'],['50-54','50-54 anni'],['55-59','55-59 anni'],['60-69','60-69 anni'],['70+','70 anni o più']], 'age');
 if(s===2)return rangeStep('Il tuo punto di partenza','Quanto pesi attualmente?','Non esistono risposte giuste o sbagliate.',40,140,1,state.weight,'kg','weight');
 if(s===3)return rangeStep('Completiamo il profilo','Quanto sei alta?','Serve soltanto per personalizzare il tuo percorso.',140,200,1,state.height,'cm','height');
 if(s===4)return bodyStep();
 if(s===5)return painsStep();
 if(s===5.5)return painBridgeStep();
 if(s===6)return choiceStep('La tua routine','Quanto ti muovi durante la settimana?','Scegli l’opzione più vicina alla tua realtà.',[['sedentary','Quasi mai','Passo gran parte della giornata seduta'],['light','1-2 volte','Cammino o faccio attività leggera'],['regular','3 volte o più','Ho già una routine abbastanza attiva']], 'activity',true);
 if(s===7)return choiceStep('Questa fase del corpo','In quale momento ti riconosci?','Ogni fase può richiedere attenzioni diverse.',[['regular','Tutto regolare','Il ciclo è regolare e non noto cambiamenti particolari'],['peri','Perimenopausa','Il ciclo è cambiato o è irregolare'],['meno','Menopausa','Il ciclo è assente da almeno 12 mesi'],['post','Post-menopausa','Sono in questa fase da alcuni anni'],['unsure','Non ne sono sicura','Voglio comunque prendermi cura di me']], 'phase',true);
 if(s===8)return choiceStep('Il tuo obiettivo','Qual è il risultato più importante per te?','Il percorso sarà costruito intorno alla tua priorità.',[['lose','Dimagrire e ridurre le misure','Sentirmi più leggera nei miei vestiti'],['tone','Tonificare e rafforzare','Sentire il corpo più stabile e forte'],['pain','Muovermi con meno fastidi','Recuperare libertà nei movimenti'],['energy','Avere più energia','Ritrovare costanza e disposizione']], 'goal',true);
 if(s===9)return targetStep();
 if(s===10)return choiceStep('Ultima domanda','Cosa ti ha bloccata finora?','Capire l’ostacolo rende il piano più realistico.',[['time','Poco tempo','Le giornate sembrano sempre piene'],['pain','Paura di sentire dolore','Gli esercizi sembrano troppo intensi'],['motivation','Mancanza di costanza','Inizio e poi perdo il ritmo'],['gym','Non amo la palestra','Preferisco muovermi a casa']], 'barrier',true,true);
 if(s===11)return loading(); if(s===12)return result();
}
function view(html){screen.innerHTML=html}
function next(){state.step++;render()} function prev(){if(state.step===5.5)state.step=5;else if(state.step>0)state.step--;render()} back.onclick=prev;
function selectValue(key,val,auto=true){state[key]=val;if(auto)setTimeout(next,180);else render()}
function choiceStep(eyebrow,title,desc,items,key,sub=false,last=false){view(`<span class="eyebrow">${eyebrow}</span><h2>${title}</h2><p>${desc}</p><div class="choices">${items.map(i=>`<button class="choice ${state[key]===i[0]?'selected':''}" onclick="selectValue('${key}','${i[0]}')"><span>${i[1]}${sub?`<span class="sub">${i[2]}</span>`:''}</span><span class="check">✓</span></button>`).join('')}</div>`)}
function rangeStep(eye,title,desc,min,max,step,val,unit,key){view(`<span class="eyebrow">${eye}</span><h2>${title}</h2><p>${desc}</p><div class="range-card"><div class="number" id="num">${val}</div><div class="unit">${unit}</div><input class="range" aria-label="${title}" type="range" min="${min}" max="${max}" step="${step}" value="${val}" oninput="state.${key}=+this.value;document.querySelector('#num').textContent=this.value"><div class="marks"><span>${min} ${unit}</span><span>${max} ${unit}</span></div><div class="measure-note">Muovi la barra fino al valore più vicino al tuo.</div></div><button class="primary" onclick="next()">Continua</button>`)}
function bodyStep(){const data=[['slim','Snello','assets/body-1.jpg'],['balanced','Proporzionato','assets/body-2.jpg'],['soft','Forme morbide','assets/body-3.jpg'],['round','Addome pronunciato','assets/body-4.jpg']];view(`<span class="eyebrow">Il tuo corpo oggi</span><h2>Quale corpo ti rappresenta di più?</h2><p>Non è un giudizio: ci aiuta a rendere il consiglio più pertinente.</p><div class="body-grid">${data.map(x=>`<button class="body-card ${state.body===x[0]?'selected':''}" onclick="selectValue('body','${x[0]}')"><img src="${x[2]}" alt="Esempio di corpo ${x[1].toLowerCase()}">${x[1]}</button>`).join('')}</div>`)}
function togglePain(v){if(v==='none')state.pains=['none'];else{state.pains=state.pains.filter(x=>x!=='none');state.pains.includes(v)?state.pains=state.pains.filter(x=>x!==v):state.pains.push(v)}render()}
function painsStep(){const cards=[['lower','Zona lombare','assets/pain-lower-back.jpg'],['knee','Ginocchia','assets/pain-knee.jpg'],['trapezius','Trapezio e schiena alta','assets/pain-trapezius.jpg']],selected=state.pains.filter(x=>x!=='none');view(`<span class="eyebrow">Mobilità quotidiana</span><h2>Dove senti dolore o rigidità?</h2><p class="multi-tip">Seleziona tutte le zone che ti infastidiscono.</p><div class="pain-cards">${cards.map(x=>`<button class="pain-card ${state.pains.includes(x[0])?'selected':''}" onclick="togglePain('${x[0]}')"><img src="${x[2]}" alt="Dolore nella zona: ${x[1]}"><i class="select-mark">${state.pains.includes(x[0])?'✓':'+'}</i><span>${x[1]}</span></button>`).join('')}</div><div class="pain-selected">${selected.map(x=>`<span class="pain-chip">${painLabels[x]}</span>`).join('')||'<span class="multi-tip">Seleziona una o più zone</span>'}</div><button class="none-btn ${state.pains.includes('none')?'selected':''}" onclick="togglePain('none')">Non sento fastidi</button><div class="actions"><button class="primary" onclick="if(state.pains.length){state.step=5.5;render()}">Continua</button></div>`)}
function painText(){const p=state.pains.filter(x=>x!=='none').map(x=>painLabels[x]);return p.length?p.join(', '):'mobilità generale'}
function painBridgeStep(){const noPain=state.pains.includes('none');view(`<span class="eyebrow">Un punto importante</span><h2>Il tuo percorso sarà costruito sulle tue risposte</h2><div class="bridge"><div class="bridge-icon">✓</div><h3>${noPain?'Proteggere la mobilità prima che compaiano i fastidi':'Lavoreremo proprio sulle zone che hai indicato'}</h3><p>${noPain?'Gli esercizi dolci aiutano a mantenere il corpo attivo, stabile e sicuro nei movimenti quotidiani.':`Le routine includeranno movimenti dolci e progressivi per <strong>${painText()}</strong>, rispettando il tuo ritmo e senza allenamenti ad alto impatto.`}</p></div><p>Ora dobbiamo capire quale beneficio aggiuntivo è più importante per il tuo corpo: dimagrimento, tono o rafforzamento.</p><button class="primary" onclick="state.step=6;render()">Continua la valutazione</button>`)}
function targetStep(){const mode=branch(),pain=painText();let title,copy,min,max,def;
 if(mode==='loss'){title='Quale peso desideri raggiungere tra 6 mesi?';copy=`I nostri esercizi si concentrano esattamente sulle zone che hai indicato: ${pain}. Ma possono offrirti anche un altro beneficio importante: sostenere il dimagrimento e aiutarti a ridurre le misure con una routine costante.`;min=Math.max(40,state.weight-35);max=state.weight;def=Math.max(min,state.weight-7)}
 else if(mode==='gain'){title='Quale peso desideri raggiungere tra 6 mesi?';copy=`I nostri esercizi si concentrano esattamente sulle zone che hai indicato: ${pain}. Ma possono offrirti anche un altro beneficio importante: sostenere il rafforzamento e l’aumento graduale della massa muscolare.`;min=state.weight;max=Math.min(140,state.weight+20);def=Math.min(max,state.weight+3)}
 else{title='Quale peso desideri raggiungere tra 6 mesi?';copy=`I nostri esercizi si concentrano esattamente sulle zone che hai indicato: ${pain}. Inoltre possono aiutarti a migliorare tono, forza e composizione corporea senza allenamenti estremi.`;min=Math.max(40,state.weight-18);max=Math.min(140,state.weight+10);def=Math.max(min,state.weight-3)}
 if(state.target===null||state.target<min||state.target>max)state.target=def;
 view(`<span class="eyebrow">Obiettivo personale</span><h2>${title}</h2><div class="insight"><strong>Il tuo percorso avrà un doppio focus</strong><p>${copy}</p></div><div class="range-card"><div class="number" id="num">${state.target}</div><div class="unit">kg</div><input class="range" type="range" min="${min}" max="${max}" value="${state.target}" oninput="state.target=+this.value;document.querySelector('#num').textContent=this.value"><div class="marks"><span>${min} kg</span><span>${max} kg</span></div></div><button class="primary" onclick="next()">Creare il mio profilo</button>`)}
function loading(){setTop();view(`<div class="loader"><div class="ring"></div><h2>Stiamo preparando il tuo percorso</h2><p>Incrociamo le tue risposte per individuare il punto di partenza più adatto.</p><div class="loadlist"><div class="loadrow" id="l1"><span>○</span>Analisi della mobilità</div><div class="loadrow" id="l2"><span>○</span>Definizione dell’intensità</div><div class="loadrow" id="l3"><span>○</span>Personalizzazione dell’obiettivo</div></div></div>`);[1,2,3].forEach((n,i)=>setTimeout(()=>{const e=document.querySelector('#l'+n);if(e){e.classList.add('done');e.querySelector('span').textContent='✓'}},650*(i+1)));setTimeout(()=>{state.step=12;render()},2700)}
function profileName(){const m=branch();return m==='loss'?'Leggerezza e mobilità':m==='gain'?'Forza e tono':'Tono e benessere'}
function benefitText(){return branch()==='loss'?'sostenere il dimagrimento e la riduzione delle misure':branch()==='gain'?'rafforzare il corpo e sostenere la massa muscolare':'migliorare tono, forza e composizione corporea'}
function result(){document.querySelector('#topbar').style.display='none';const pains=state.pains.includes('none')?'Mobilità generale':painText();view(`<div class="result-head"><div class="brand-lockup large"><span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M7 20c7-1 11-6 14-14 5 7 5 15 1 19-5 4-12 3-15-5Z" fill="#f2c86b"/><path d="M9 24c5-7 9-10 14-15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></span><span>MENOPAUSA LEGGERA</span></div><div class="score"><strong>78%</strong></div><span class="eyebrow">Profilo completato</span><h2>Il percorso più adatto a te è<br>“${profileName()}”</h2><p>In base alle tue risposte, il tuo percorso deve lavorare su <strong>${pains}</strong> e contemporaneamente aiutarti a ${benefitText()}.</p></div><div class="profile"><div class="profile-row"><span>Punto di partenza</span><strong>${state.weight} kg • ${state.height} cm</strong></div><div class="profile-row"><span>Obiettivo in 6 mesi</span><strong>${state.target} kg</strong></div><div class="profile-row"><span>Focus mobilità</span><strong>${pains}</strong></div><div class="profile-row"><span>Strategia indicata</span><strong>${profileName()}</strong></div></div><div class="creator"><img src="assets/giulia-moretti.png" alt="Giulia Moretti, fisioterapista e ideatrice del percorso Menopausa Leggera"><div class="creator-copy"><span class="eyebrow">Chi ha creato il percorso</span><h3>Piacere, sono Giulia Moretti</h3><p>Sono fisioterapista e ho creato Menopausa Leggera per rendere il movimento dolce più semplice da seguire a casa. Ho organizzato ogni routine in modo progressivo, con indicazioni visive chiare e particolare attenzione alla mobilità, alla forza e alla costanza.</p><span class="creator-role">Fisioterapista e ideatrice del percorso</span></div></div><div class="vsl"><div class="video" id="video"><div class="video-copy"><small>Preparato sulle tue risposte</small><h3 id="vtitle">Il tuo piano non deve essere uguale a quello di tutte</h3><p id="vtext">Guarda questa breve presentazione per capire perché il metodo si adatta al tuo obiettivo.</p><button class="play" aria-label="Riproduci presentazione" onclick="playVsl()">▶</button></div></div><div class="timeline"><span id="vprogress"></span></div></div><div class="offer hidden" id="offer"><div class="brand-lockup large"><span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M7 20c7-1 11-6 14-14 5 7 5 15 1 19-5 4-12 3-15-5Z" fill="#f2c86b"/><path d="M9 24c5-7 9-10 14-15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></span><span>MENOPAUSA LEGGERA</span></div><span class="eyebrow">Il prossimo passo</span><h3>Sfida Menopausa Leggera</h3><p>Per te, il percorso dà priorità a <strong>${pains}</strong> e a un lavoro progressivo per ${benefitText()} — direttamente a casa e senza attrezzature costose.</p><ul class="list"><li>7 routine illustrate di Pilates dolce</li><li>Movimenti a basso impatto da fare a casa</li><li>Menu orientativo di 7 giorni</li><li>Lista della spesa e calendario</li><li>Accesso digitale immediato</li></ul><div class="price"><del>€29,90</del><strong>€9,90</strong><span>pagamento unico</span></div><button class="primary" onclick="checkout()">Sì, voglio iniziare oggi</button><div class="checkout-note">Accesso digitale • Garanzia di 7 giorni</div></div>`)}
let playing=false;function playVsl(){if(playing)return;playing=true;const btn=document.querySelector('.play');if(btn)btn.remove();const slides=[['Le tue risposte mostrano un punto di partenza preciso',`Hai indicato ${painText()} come area prioritaria e ${state.target} kg come obiettivo.`],['Non hai bisogno di allenamenti estremi',`Il percorso usa movimenti dolci per lavorare sulla mobilità e aiutarti a ${benefitText()}.`],['Il metodo si adatta alla tua realtà',state.activity==='sedentary'?'Inizierai gradualmente, anche se oggi ti muovi poco.':'Le routine brevi si inseriscono facilmente nella tua settimana.'],['Non serve andare in palestra','Ti bastano una sedia stabile, uno spazio tranquillo e pochi minuti per te.'],['Puoi iniziare oggi','Tutto è già organizzato: esercizi illustrati, menu orientativo e calendario.']];let i=0;const title=document.querySelector('#vtitle'),text=document.querySelector('#vtext'),bar=document.querySelector('#vprogress');function tick(){if(i<slides.length){title.textContent=slides[i][0];text.textContent=slides[i][1];bar.style.transition='width 3s linear';bar.style.width=((i+1)/slides.length*100)+'%';i++;setTimeout(tick,3000)}else{document.querySelector('#offer').classList.remove('hidden');document.querySelector('#offer').scrollIntoView({behavior:'smooth',block:'start'})}}tick()}
function checkout(){window.location.href='https://pay.hotmart.com/O107758083T?checkoutMode=10'}
function registerQuizTool(){const context=document.modelContext;if(!context?.registerTool)return;const lifecycle=new AbortController();const ages=['18-29','30-40','41-44','45-49','50-54','55-59','60-69','70+'],goals=['lose','tone','pain','energy'];Promise.resolve(context.registerTool({name:'complete_menopause_pilates_quiz',title:'Completa la valutazione Pilates',description:'Compila il quiz con età, misure, fastidi e obiettivo e mostra il profilo personalizzato finale.',inputSchema:{type:'object',properties:{age:{type:'string',enum:ages},weight:{type:'number',minimum:40,maximum:140},height:{type:'number',minimum:140,maximum:200},pains:{type:'array',items:{type:'string',enum:Object.keys(painLabels)}},goal:{type:'string',enum:goals},target:{type:'number',minimum:40,maximum:140}},required:['age','weight','height','pains','goal','target'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!ages.includes(input.age)||!goals.includes(input.goal)||!Array.isArray(input.pains)||input.pains.some(x=>!(x in painLabels)))throw new Error('Risposte non valide');Object.assign(state,input,{step:12});render();return{profile:profileName(),bmi:Math.round(bmi()*10)/10,target:state.target}}},{signal:lifecycle.signal})).catch(()=>{})}
const optimizedAssets={
  'assets/body-1.jpg':'assets/optimized/body-1.webp','assets/body-2.jpg':'assets/optimized/body-2.webp','assets/body-3.jpg':'assets/optimized/body-3.webp','assets/body-4.jpg':'assets/optimized/body-4.webp',
  'assets/giulia-moretti.png':'assets/optimized/giulia-moretti.webp','assets/logo-sfida-pilates-compact.png':'assets/optimized/logo-sfida-pilates-compact.webp',
  'assets/pain-knee.jpg':'assets/optimized/pain-knee.webp','assets/pain-lower-back.jpg':'assets/optimized/pain-lower-back.webp','assets/pain-trapezius.jpg':'assets/optimized/pain-trapezius.webp'
};
const originalView=view;
view=function(html){for(const [source,optimized] of Object.entries(optimizedAssets))html=html.replaceAll(source,optimized);originalView(html)}
let youtubeApiPromise;
function loadYouTubeApi(){
  if(window.YT&&window.YT.Player)return Promise.resolve(window.YT);
  if(youtubeApiPromise)return youtubeApiPromise;
  youtubeApiPromise=new Promise(resolve=>{
    const previousReady=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=function(){
      if(typeof previousReady==='function')previousReady();
      resolve(window.YT);
    };
    if(!document.querySelector('script[src="https://www.youtube.com/iframe_api"]')){
      const script=document.createElement('script');
      script.src='https://www.youtube.com/iframe_api';
      document.head.appendChild(script);
    }
  });
  return youtubeApiPromise;
}
function scrollToOfferPrice(){
  const price=document.querySelector('#offer .price');
  if(price)price.scrollIntoView({behavior:'smooth',block:'center'});
}
function initVslPlayer(){
  loadYouTubeApi().then(()=>{
    const frame=document.querySelector('#youtube-vsl');
    if(!frame||!frame.isConnected)return;
    new window.YT.Player(frame,{events:{onStateChange(event){
      if(event.data===window.YT.PlayerState.ENDED)scrollToOfferPrice();
    }}});
  });
}
const originalResult=result;
result=function(){
  originalResult();
  const video=document.querySelector('#video');
  if(video){
    video.innerHTML='<iframe id="youtube-vsl" src="https://www.youtube-nocookie.com/embed/Go-1foBe7Kg?enablejsapi=1&controls=0&fs=0&disablekb=1&iv_load_policy=3&modestbranding=1&rel=0&playsinline=1" title="Presentazione della Sfida Pilates 60 Giorni" loading="lazy" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>';
    initVslPlayer();
  }
  const timeline=document.querySelector('.timeline');
  if(timeline)timeline.remove();
  const offer=document.querySelector('#offer');
  if(!offer)return;
  offer.classList.remove('hidden');
  const title=offer.querySelector('h3');
  const description=offer.querySelector('p');
  const list=offer.querySelector('.list');
  const price=offer.querySelector('.price');
  const note=offer.querySelector('.checkout-note');
  if(title)title.textContent='Sfida Pilates 60 Giorni';
  if(description)description.innerHTML=`Un percorso completo creato per accompagnarti giorno dopo giorno. Nel tuo caso, il programma darà priorità a <strong>${state.pains.includes('none')?'mobilità generale':painText()}</strong> e a un lavoro progressivo per ${benefitText()} — direttamente a casa.`;
  if(list)list.innerHTML='<li>App con il percorso giornaliero organizzato</li><li>Lezioni guidate di Pilates dolce da seguire a casa</li><li>Programma progressivo completo di 60 giorni</li><li>PDF illustrati, guide pratiche e materiali di supporto</li><li>Calendario per monitorare costanza e progressi</li><li>Accesso digitale immediato</li>';
  if(price)price.innerHTML='<del>€79,00</del><strong>€37,00</strong><span>pagamento unico</span>';
  if(note)note.textContent='Accesso completo • Nessun abbonamento • Garanzia di 7 giorni';
}
registerQuizTool();
render();
</script>
